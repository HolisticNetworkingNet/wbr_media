[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wbr-media"
version = "0.2.0"
description = "Portable media infrastructure for Django."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Thomas Belknap" }]
dependencies = [
    "Django>=4.2",
    "Pillow",
]
classifiers = [
    "Framework :: Django",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/holisticnetworkingnet/wbr_media"
Repository = "https://github.com/holisticnetworkingnet/wbr_media"
Issues = "https://github.com/holisticnetworkingnet/wbr_media/issues"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "ruff>=0.9,<1",
    "twine>=6.1",
]
test = [
    "pytest>=8.0",
    "pytest-django>=4.8",
]
security = [
    "pip-audit>=2.7,<3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["wbr_media*"]
exclude = ["demo*", "tests*"]

[tool.setuptools.package-data]
wbr_media = ["templates/**/*.html", "static/**/*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "demo.demo.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["demo/exports"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
