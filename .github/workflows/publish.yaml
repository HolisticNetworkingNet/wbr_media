name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish package
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/wbr-media

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out the release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install release validation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,test]"

      - name: Verify release source and version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/validate_release_ref.py --release-tag "$RELEASE_TAG" --commit "$GITHUB_SHA"

      - name: Run release quality checks
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m pytest -q -W error

      - name: Build validated package distributions
        run: python -m build --outdir dist

      - name: Check distribution metadata
        run: python -m twine check --strict dist/*

      - name: Validate distribution contents
        run: python scripts/validate_distribution.py dist

      - name: Validate clean artifact installations
        run: python scripts/validate_installation.py dist

      - name: Publish validated distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
