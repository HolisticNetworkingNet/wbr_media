<figure class="wbr-media wbr-media--image {{ class_name }}">
    <img
            src="{{ media_url }}"
            alt="{{ alt }}"
            {% if width %}width="{{ width }}"{% endif %}
            {% if height %}height="{{ height }}"{% endif %}
    >
    {% if asset.description %}
        <figcaption>{{ asset.description }}</figcaption>
    {% endif %}
</figure>
