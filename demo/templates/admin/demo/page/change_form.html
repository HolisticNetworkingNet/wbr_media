{% extends "admin/change_form.html" %}
{% load static %}

{% block extrastyle %}
  {{ block.super }}
  <style>
    fieldset.image-panel { display: grid; grid-template-columns: minmax(180px, 1fr) minmax(360px, 2fr); gap: 0 1.5rem; }
    fieldset.image-panel > .description { grid-column: 1 / -1; grid-row: 1; }
    fieldset.image-panel > .form-row { border-bottom: 0; padding: 10px 0; }
    fieldset.image-panel > .field-image_preview { grid-column: 1; grid-row: 2 / span 5; align-self: start; }
    fieldset.image-panel > .field-image_file,
    fieldset.image-panel > .field-image,
    fieldset.image-panel > .field-image_title,
    fieldset.image-panel > .field-image_alt_text,
    fieldset.image-panel > .field-image_description { grid-column: 2; }
    fieldset.image-panel > .field-image .readonly { margin: 0; }
    fieldset.image-panel > .field-image img { display: block; max-width: 100%; max-height: 260px; object-fit: contain; border: 1px solid #d8dde0; background: #f8f8f8; }
    fieldset.image-panel > .field-image_preview .image-placeholder { display: grid; place-items: center; min-height: 220px; color: #6b7280; background: #f3f4f6; border: 1px dashed #b8c0c7; }
    fieldset.image-panel > .field-image_file input[type=file] { width: 100%; }
    @media (max-width: 800px) {
      fieldset.image-panel { display: block; }
    }
  </style>
{% endblock %}
