{% extends "admin/change_form.html" %}

{% block extrastyle %}
  {{ block.super }}
  <style>
    fieldset.image-panel { display:grid; grid-template-columns:minmax(180px,1fr) minmax(360px,2fr); gap:0 1.25rem; padding:8px 12px 10px; overflow:hidden; }
    fieldset.image-panel > h2 { display:none; }
    fieldset.image-panel > .description { grid-column:1/-1; margin:0 0 4px; padding:0; }
    fieldset.image-panel > .form-row { border-bottom:0; padding:4px 0; margin:0; }
    fieldset.image-panel > .field-media_asset_preview { grid-column:1; grid-row:2/span 5; align-self:start; }
    fieldset.image-panel > .field-media_asset_preview label,
    fieldset.image-panel > .field-media_asset_preview .help { display:none; }
    fieldset.image-panel > .field-media_asset_preview .flex-container > div,
    fieldset.image-panel > .field-media_asset_preview .readonly { width:100%; margin:0; padding:0; }
    fieldset.image-panel > .field-image_file,
    fieldset.image-panel > .field-image,
    fieldset.image-panel > .field-image_title,
    fieldset.image-panel > .field-image_alt_text,
    fieldset.image-panel > .field-image_description { grid-column:2; }
    fieldset.image-panel img { display:block; width:auto; height:auto; max-width:100%; max-height:260px; object-fit:contain; border:1px solid #d8dde0; background:#f8f8f8; }
    fieldset.image-panel .image-placeholder,
    fieldset.image-panel .file-placeholder { display:grid; place-items:center; min-height:180px; color:#6b7280; background:#f3f4f6; border:1px dashed #b8c0c7; }
    fieldset.image-panel input[type=text], fieldset.image-panel textarea, fieldset.image-panel select { padding:5px 6px; }
    fieldset.image-panel textarea { min-height:66px; }
    @media (max-width:800px) { fieldset.image-panel { display:block; } }
  </style>
{% endblock %}

{% block admin_change_form_document_ready %}
  {{ block.super }}
  <script>
    (function () {
      const input = document.getElementById("id_image_file");
      const preview = document.getElementById("media-asset-preview");
      if (!input || !preview) return;
      input.addEventListener("change", function () {
        const file = input.files && input.files[0];
        if (!file || !file.type.startsWith("image/")) return;
        const reader = new FileReader();
        reader.addEventListener("load", function () {
          if (preview.tagName.toLowerCase() === "img") { preview.src = reader.result; return; }
          const image = document.createElement("img");
          image.id = "media-asset-preview"; image.alt = "Selected image preview"; image.src = reader.result;
          preview.replaceWith(image);
        });
        reader.readAsDataURL(file);
      });
    }());
  </script>
{% endblock %}
